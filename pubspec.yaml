# 智能香薰调节器 - 项目配置文件
name: perfume_app                  # 项目名称
description: "一款用ESP32开发的智能气味情绪调节器的配套APP，支持蓝牙控制、文字交互和情绪关怀功能"
publish_to: 'none'                # 禁止发布到 pub.dev，私有项目保留此行
version: 1.0.0+1                 # 应用版本与构建号：版本号1.0.0，构建号1
environment:
  sdk: ^3.11.3                   # 要求 Dart SDK >=3.11.3 <4.0.0
dependencies:                    # 生产依赖（打包进应用）
  flutter:
    sdk: flutter                 # 依赖 Flutter SDK 本身
  flutter_blue_plus: ^1.32.12    # 蓝牙通信库，用于扫描、连接设备
  permission_handler: ^11.3.1    # 动态权限请求（蓝牙、位置等）
  cupertino_icons: ^1.0.8        # iOS 风格图标库
  provider: ^6.1.2               # 状态管理方案
  shared_preferences: ^2.3.3     # 简单键值对本地存储
  native_device_orientation: ^2.0.3   # 获取/锁定设备方向
  video_player: ^2.9.1           # 视频播放支持
  http: ^1.2.1                   # HTTP 客户端，用于 API 通信
  hive: ^2.2.3                   # 轻量 NoSQL 数据库（Hive）
  hive_flutter: ^1.1.0           # Hive 的 Flutter 绑定
  sqflite: ^2.3.3                # SQLite 数据库插件
  sqflite_common_ffi: ^2.3.0     # SQLite 在桌面端（Windows/Linux/macOS）的 FFI 实现
  path_provider: ^2.1.3          # 获取常用文件系统路径（用于数据库存储路径等）
  uuid: ^4.4.0                   # 生成 UUID
  intl: ^0.19.0                  # 国际化支持（日期、数字格式化等）

dev_dependencies:                # 开发依赖（不打包进应用）
  flutter_test:
    sdk: flutter                 # Flutter 测试框架
  build_runner: ^2.4.13          # 代码生成运行器
  hive_generator: ^2.0.1         # Hive 类型适配器生成器

  flutter_lints: ^6.0.0           # 代码风格检查规则（注意此处版本号可能不完整，通常为 ^6.0.0）

flutter:                         # Flutter 相关配置
  uses-material-design: true     # 启用 Material 图标字体
  assets:                        # 声明需要打包的静态资源
    - assets/images/             # 图片资源目录
    - assets/videos/             # 视频资源目录

# 依赖覆盖：阻止加载 permission_handler_windows 以避免 Windows 构建时 NuGet 报错
dependency_overrides:
  permission_handler_windows:
    path: empty_permission_handler_windows    # 使用本地空包代替真正的包

# 构建钩子：使用系统 SQLite；Windows 的系统库名称是 winsqlite3.dll
hooks:
  user_defines:                  # 用户自定义的编译宏定义
    sqlite3:
      source: system             # 使用系统自带的 SQLite
      name: sqlite3              # Linux/macOS 的库名称
      name_windows: winsqlite3    # Windows 自带的 SQLite 库